<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<title>Part Scanner</title>
<style>
  body { margin: 0; background: #0a0a0f; color: #0f0; font-family: monospace; padding: 16px; font-size: 13px; }
  .btn { padding: 10px 20px; margin: 5px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .btn-green { background: #22c55e; color: #fff; }
  .btn-red { background: #ef4444; color: #fff; }
  .btn-blue { background: #3b82f6; color: #fff; }
  .btn-yellow { background: #eab308; color: #000; }
  #log { background: #000; padding: 12px; margin-top: 16px; font-size: 12px; max-height: 600px; overflow-y: auto; white-space: pre; border-radius: 8px; }
  h2 { color: #fff; }
  .result-box { background: #111; border: 1px solid #333; padding: 12px; margin: 8px 0; border-radius: 8px; }
</style>
</head>
<body>
<h2>🔬 Part Name Scanner — Find ALL 59 Parts</h2>
<p>Scan 所有 Parts，顯示名稱 + opacity，確定邊個 Part 控制「有衣服身體」vs「裸色身體」</p>

<button class="btn btn-green" onclick="scanAll()">Scan ALL Parts with Names</button>
<button class="btn btn-red" onclick="setBlack()">Set BLACK outfit</button>
<button class="btn btn-blue" onclick="setWhite()">Set WHITE outfit</button>
<button class="btn btn-yellow" onclick="compare()">Compare Black vs White Parts</button>

<div id="log"></div>

<script src="https://vampire.kitahim.uk/static/embed/embed.js"
  data-model="https://vampire.kitahim.uk/static/live2d/vampire/%E5%90%B8%E8%A1%80%E9%AC%BC.model3.json"
  data-knowledge="https://vampire.kitahim.uk/knowledge.js?v=20260611v18"
  data-api="/api/tts">
</script>
<script>
var logEl = document.getElementById('log');
var blackParts = {};
var whiteParts = {};

function log(msg) {
  var ts = new Date().toISOString().substring(11, 23);
  logEl.textContent += '[' + ts + '] ' + msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

function getCM() {
  var iWin = document.querySelector('iframe') && document.querySelector('iframe').contentWindow;
  if (!iWin || !iWin.model) return null;
  try { return iWin.model.internalModel.coreModel; } catch(e) { return null; }
}

function getIM() {
  var iWin = document.querySelector('iframe') && document.querySelector('iframe').contentWindow;
  if (!iWin || !iWin.model) return null;
  try { return iWin.model.internalModel; } catch(e) { return null; }
}

function scanAll() {
  var cm = getCM();
  var im = getIM();
  log('=== SCAN ALL PARTS WITH NAMES ===');
  if (!cm || !im) { log('Model not ready'); return; }
  
  // Try to get part names from cdi3.json via model3.json FileReferences
  // First, try the Live2D Cubism SDK native API
  var results = [];
  var scanned = 0;
  
  // Try im.parts or im._parts
  var parts = null;
  if (im.parts) parts = im.parts;
  else if (im._parts) parts = im._parts;
  
  if (parts) {
    log('Found parts object: ' + (typeof parts));
    if (typeof parts.getCount === 'function') {
      var count = parts.getCount();
      log('Part count: ' + count);
      for (var i = 0; i < count; i++) {
        try {
          var pid = parts.getId ? parts.getId(i) : 'N/A';
          var pop = parts.getOpacity ? parts.getOpacity(i) : null;
          var pval = pop !== null ? pop.toFixed(3) : 'N/A';
          results.push({ index: i, id: pid, opacity: pval });
          log('  [' + i + '] ' + pid + ' opacity=' + pval);
          scanned++;
        } catch(e) { log('  [' + i + '] ERR: ' + e.message); }
      }
    } else {
      // Try numeric index access
      for (var i = 0; i < 200; i++) {
        try {
          var pid = parts.getId ? parts.getId(i) : (parts[i] ? parts[i].Id : null);
          if (!pid) break;
          var opacity = parts.getOpacity ? parts.getOpacity(i) : (parts[i] ? parts[i].Opacity : '?');
          var oval = typeof opacity === 'number' ? opacity.toFixed(3) : String(opacity);
          results.push({ index: i, id: pid, opacity: oval });
          log('  [' + i + '] ' + pid + ' = ' + oval);
          scanned++;
        } catch(e) { break; }
      }
    }
  } else {
    log('im.parts NOT FOUND. Trying model.internalModel.coreModel._hierarchy...');
    // Try to find parts through coreModel
    var core = cm;
    if (core._hierarchy) {
      try {
        var items = core._hierarchy.Object.ParameterObjects || [];
        log('Found ParameterObjects: ' + items.length);
      } catch(e) {}
    }
    
    // Try coreModel drawables
    try {
      if (typeof core.getDrawableCount === 'function') {
        var dc = core.getDrawableCount();
        log('Drawable count: ' + dc);
        for (var i = 0; i < dc; i++) {
          var dname = '';
          try { dname = core.getDrawableId(i) || ''; } catch(e) {}
          var dop = 1;
          try { dop = core.getDrawableOpacity(i); } catch(e) {}
          if (dname.match(/part/i) || dname.match(/body/i) || dname.match(/costume/i) || dname.match(/outfit/i) || dname.match(/cloth/i)) {
            log('  DRAWABLE [' + i + '] ' + dname + ' opacity=' + dop.toFixed(3));
          }
        }
      }
    } catch(e) { log('Drawable API ERR: ' + e.message); }
    
    // Last resort: try index 0-100 via direct API
    log('Trying index-based part opacity scan...');
    var partNames = [];
    for (var i = 0; i < 100; i++) {
      var pname = 'Part' + i;
      try {
        var op = cm.getPartOpacityById(pname);
        if (op !== undefined) {
          log('  FOUND: ' + pname + ' = ' + op.toFixed(3));
          scanned++;
        }
      } catch(e) {}
    }
    log('Total parts found by index scan: ' + scanned);
  }
  
  return results;
}

function setBlack() {
  var cm = getCM();
  var iWin = document.querySelector('iframe').contentWindow;
  log('=== SET BLACK OUTFIT ===');
  // Set head accessories visible (black)
  var head = ['Part26','Part30'];
  // Set body parts - need to find which part is "dressed body"
  // From previous test: Part59=0.0 was the "clothed body" (Part59=0 means body IS visible/covered)
  // But user said body was NAKED when Part59=0...
  // Try: keep Part59=1 (dressed body visible), set Part26/30=1 (head accessories black)
  var parts_to_set = ['Part26','Part30','Part59'];
  for (var p of parts_to_set) {
    try {
      var was = cm.getPartOpacityById(p).toFixed(3);
      cm.setPartOpacityById(p, 1.0);
      var now = cm.getPartOpacityById(p).toFixed(3);
      log('  ' + p + ': ' + was + ' -> ' + now + ' (set to 1.0)');
    } catch(e) { log('  ' + p + ' ERR: ' + e.message); }
  }
  if (iWin && iWin.emoteState) {
    iWin.emoteState.outfit = 'vampire';
  }
}

function setWhite() {
  var cm = getCM();
  var iWin = document.querySelector('iframe').contentWindow;
  log('=== SET WHITE OUTFIT ===');
  // Set head accessories invisible (white)
  // Keep Part59=1 (body still has some version visible)
  var parts_to_set = ['Part26','Part30'];
  for (var p of parts_to_set) {
    try {
      var was = cm.getPartOpacityById(p).toFixed(3);
      cm.setPartOpacityById(p, 0.0);
      var now = cm.getPartOpacityById(p).toFixed(3);
      log('  ' + p + ': ' + was + ' -> ' + now + ' (set to 0.0)');
    } catch(e) { log('  ' + p + ' ERR: ' + e.message); }
  }
  if (iWin && iWin.emoteState) {
    iWin.emoteState.outfit = 'vampire2';
  }
}

function compare() {
  var cm = getCM();
  log('=== COMPARE BLACK vs WHITE ===');
  log('Current Part states:');
  for (var i = 0; i < 100; i++) {
    var pname = 'Part' + i;
    try {
      var op = cm.getPartOpacityById(pname);
      if (op !== undefined) {
        log('  Part' + i + ' = ' + op.toFixed(3));
      }
    } catch(e) { break; }
  }
}

window.addEventListener('message', function(e) {
  if (e.data && e.data.ns === 'avatar-widget' && e.data.type === 'boot-success') {
    log('Widget loaded. Run the test buttons above.');
    setTimeout(scanAll, 3000);
  }
});
</script>
</body>
</html>
